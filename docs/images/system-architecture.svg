<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <style>
    .box { fill:#f7f9fc; stroke:#274060; stroke-width:2; rx:8; ry:8; }
    .title { fill:#274060; font-family:Segoe UI, Arial, sans-serif; font-size:20px; font-weight:600; }
    .text { fill:#1f2937; font-family:Segoe UI, Arial, sans-serif; font-size:16px; }
    .arrow { stroke:#274060; stroke-width:2; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#274060" />
    </marker>
  </defs>

  <!-- Clients -->
  <rect class="box" x="40" y="40" width="320" height="160" />
  <text class="title" x="60" y="70">Clients</text>
  <text class="text" x="60" y="100">• Game Apps (Unity/Unreal/Mobile)</text>
  <text class="text" x="60" y="125">• Admin UI</text>
  <text class="text" x="60" y="150">• Client Dashboard</text>

  <!-- REST API -->
  <rect class="box" x="430" y="40" width="320" height="160" />
  <text class="title" x="450" y="70">REST API — NestJS</text>
  <text class="text" x="450" y="100">• Middlewares (Tenant, Rate Limit)</text>
  <text class="text" x="450" y="125">• Guards (ApiKey, Bearer)</text>
  <text class="text" x="450" y="150">• Controllers & DTOs</text>

  <!-- Modules -->
  <rect class="box" x="430" y="230" width="320" height="220" />
  <text class="title" x="450" y="260">Core Modules</text>
  <text class="text" x="450" y="290">• players, progression, achievements</text>
  <text class="text" x="450" y="315">• items, inventory, store, quests</text>
  <text class="text" x="450" y="340">• counters, events, webhooks</text>
  <text class="text" x="450" y="365">• realtime (WS), admin, client</text>

  <!-- MongoDB -->
  <rect class="box" x="840" y="230" width="300" height="120" />
  <text class="title" x="860" y="260">MongoDB (Mongoose)</text>
  <text class="text" x="860" y="290">• Collections with timestamps</text>
  <text class="text" x="860" y="315">• Indexes & idempotency keys</text>

  <!-- WebSocket -->
  <rect class="box" x="840" y="40" width="300" height="160" />
  <text class="title" x="860" y="70">Realtime — WebSocket</text>
  <text class="text" x="860" y="100">• Gateway validates x-api-key</text>
  <text class="text" x="860" y="125">• Publish by projectId & eventTypes</text>

  <!-- Webhooks -->
  <rect class="box" x="840" y="380" width="300" height="160" />
  <text class="title" x="860" y="410">Webhooks</text>
  <text class="text" x="860" y="440">• Subscriptions per project</text>
  <text class="text" x="860" y="465">• Deliveries, retries, HMAC</text>

  <!-- Arrows -->
  <line class="arrow" x1="360" y1="120" x2="430" y2="120" />
  <line class="arrow" x1="590" y1="200" x2="590" y2="230" />
  <line class="arrow" x1="750" y1="310" x2="840" y2="290" />
  <line class="arrow" x1="750" y1="120" x2="840" y2="120" />
  <line class="arrow" x1="750" y1="340" x2="840" y2="420" />

  <!-- Legend -->
  <text class="text" x="40" y="640">Legend: Clients → REST API → Modules → MongoDB; Events fan-out to WebSocket and Webhooks.</text>
</svg>